<style>
    body {
        font-family: 'Sarabun', sans-serif;
        background-color: #f8f6f0;
        color: #1e293b;
    }

    .chart-container {
        position: relative;
        width: 100%;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 300px;
        max-height: 380px;
    }

    @media (min-width: 768px) {
        .chart-container { height: 340px; }
    }

    /* ---------- A4 Page Simulation ---------- */
    .a4-page {
        width: 210mm;
        min-height: 297mm;
        padding: 15mm;
        margin: 10mm auto;
        background: #ffffff;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        position: relative;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
    }

    /* ส่วนท้ายเอกสาร: ดันไปติดขอบล่างกระดาษเสมอ เนื้อหาด้านบนจึงเรียงชิดกัน */
    .a4-footer {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid #cbd5e1;
    }

    /* กล่องข้อมูลลูกค้า: ต่อเนื่องล็อกกับตารางรายการสินค้าพอดี */
    .a4-customer-box {
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        border-bottom: none;
    }
    .a4-items-table thead tr:first-child th { border-top: none; }

    /* คำชี้แจงการยื่นเสนอราคา — Tailwind preflight ลบ list-style ทิ้ง ต้องคืนค่าเอง */
    .a4-declaration ol { list-style: decimal outside; margin: 0 0 4px 0; padding-left: 22px; }
    .a4-declaration ul { list-style: disc outside; margin: 0 0 4px 0; padding-left: 22px; }
    .a4-declaration li { display: list-item; margin: 0 0 4px 0; padding-left: 2px; }
    .a4-declaration li:last-child { margin-bottom: 0; }
    .a4-declaration p { margin: 0 0 6px 0; }
    .a4-declaration p:last-child { margin-bottom: 0; }

    @media (max-width: 900px) {
        .a4-page {
            width: 100%;
            min-width: 0;
            padding: 16px;
            margin: 10px 0;
            overflow-x: auto;
        }
    }

    /* ---------- Print Rules ---------- */
    @media print {
        @page { size: A4; margin: 0; }
        body {
            background-color: #ffffff !important;
            color: #000000 !important;
        }
        .no-print { display: none !important; }
        main { padding: 0 !important; max-width: none !important; }
        .a4-page {
            box-shadow: none !important;
            margin: 0 !important;
            width: 210mm !important;
            min-height: 297mm !important;
            page-break-after: always;
            break-after: page;
        }
        .a4-page:last-child {
            page-break-after: avoid;
            break-after: avoid;
        }
        table { page-break-inside: auto; }
        tr { page-break-inside: avoid; }
    }

    /* Ctrl+P บนหน้าหลัก: แสดงเฉพาะกรอบเอกสาร A4 (กันหน้าว่างจาก header/แท็บอื่น) */
    @media print {
        body.printing * { visibility: hidden !important; }
        body.printing #a4-render-area,
        body.printing #a4-render-area * { visibility: visible !important; }
        body.printing #a4-render-area {
            position: absolute !important;
            left: 0 !important;
            top: 0 !important;
            width: 210mm !important;
            margin: 0 !important;
            padding: 0 !important;
            background: none !important;
            box-shadow: none !important;
        }
    }

    /* SweetAlert z-index above header */
    .swal2-container { z-index: 10000 !important; }

    /* Scrollbar polish for tables on mobile */
    .overflow-x-auto::-webkit-scrollbar { height: 8px; }
    .overflow-x-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* ---------- Global working-status effects ---------- */
.top-progress {
    display: none;
    position: fixed; top: 0; left: 0; right: 0;
    height: 4px; z-index: 9999; pointer-events: none;
    background: linear-gradient(90deg, #10b981, #3b82f6, #8b5cf6);
    background-size: 200% 100%;
    animation: gp-slide 0.9s linear infinite;
}
body.gs-busy .top-progress { display: block; }
@keyframes gp-slide {
    0% { background-position: 0% 0; }
    100% { background-position: -200% 0; }
}
#busy-pill {
    display: none;
    position: fixed; bottom: 18px; right: 18px; z-index: 9999;
    pointer-events: none;
    align-items: center; gap: 8px;
    padding: 8px 14px;
    background: #1e293b; color: #fff;
    font-size: 12px; font-weight: 600;
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    animation: gp-pop .25s ease-out;
}
body.gs-busy #busy-pill { display: flex; }
#busy-pill::before {
    content: '';
    width: 12px; height: 12px; flex: none;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff; border-radius: 50%;
    animation: gp-spin .7s linear infinite;
}
@keyframes gp-spin { to { transform: rotate(360deg); } }
@keyframes gp-pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ปุ่มที่เพิ่งถูกคลิก → pulse + spinner มุมขวา */
button.btn-flash {
    position: relative !important;
    overflow: hidden;
    animation: gp-pulse .45s ease-out;
}
button.btn-flash::after {
    content: '';
    position: absolute; right: 6px; top: 50%;
    width: 11px; height: 11px; margin-top: -5.5px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    opacity: .55; border-radius: 50%;
    animation: gp-spin .7s linear infinite;
}
@keyframes gp-pulse {
    0% { transform: scale(1); filter: brightness(1); }
    40% { transform: scale(.96); filter: brightness(.92); }
    100% { transform: scale(1); filter: brightness(1); }
}
@media (prefers-reduced-motion: reduce) {
    .top-progress, button.btn-flash, button.btn-flash::after, #busy-pill::before { animation: none !important; }
}
</style>
