<style>
    body {
        font-family: 'Sarabun', sans-serif;
        background-color: #f8f6f0;
        color: #1e293b;
    }

    .chart-container {
        position: relative;
        width: 100%;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 300px;
        max-height: 380px;
    }

    @media (min-width: 768px) {
        .chart-container { height: 340px; }
    }

    /* ---------- A4 Page Simulation ---------- */
    .a4-page {
        width: 210mm;
        min-height: 297mm;
        padding: 15mm;
        margin: 10mm auto;
        background: #ffffff;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        position: relative;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
    }

    /* ส่วนท้ายเอกสาร: ดันไปติดขอบล่างกระดาษเสมอ เนื้อหาด้านบนจึงเรียงชิดกัน */
    .a4-footer {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid #cbd5e1;
    }

    /* กล่องข้อมูลลูกค้า: ต่อเนื่องล็อกกับตารางรายการสินค้าพอดี */
    .a4-customer-box {
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        border-bottom: none;
    }
    .a4-items-table thead tr:first-child th { border-top: none; }

    /* คำชี้แจงการยื่นเสนอราคา — Tailwind preflight ลบ list-style ทิ้ง ต้องคืนค่าเอง */
    .a4-declaration ol { list-style: decimal outside; margin: 0 0 4px 0; padding-left: 22px; }
    .a4-declaration ul { list-style: disc outside; margin: 0 0 4px 0; padding-left: 22px; }
    .a4-declaration li { display: list-item; margin: 0 0 4px 0; padding-left: 2px; }
    .a4-declaration li:last-child { margin-bottom: 0; }
    .a4-declaration p { margin: 0 0 6px 0; }
    .a4-declaration p:last-child { margin-bottom: 0; }

    @media (max-width: 900px) {
        .a4-page {
            width: 100%;
            min-width: 0;
            padding: 16px;
            margin: 10px 0;
            overflow-x: auto;
        }
    }

    /* ---------- Print Rules ---------- */
    @media print {
        @page { size: A4; margin: 0; }
        body {
            background-color: #ffffff !important;
            color: #000000 !important;
        }
        .no-print { display: none !important; }
        main { padding: 0 !important; max-width: none !important; }
        .a4-page {
            box-shadow: none !important;
            margin: 0 !important;
            width: 210mm !important;
            min-height: 297mm !important;
            page-break-after: always;
            break-after: page;
        }
        .a4-page:last-child {
            page-break-after: avoid;
            break-after: avoid;
        }
        table { page-break-inside: auto; }
        tr { page-break-inside: avoid; }
    }

    /* Ctrl+P บนหน้าหลัก: แสดงเฉพาะกรอบเอกสาร A4 (กันหน้าว่างจาก header/แท็บอื่น) */
    @media print {
        body.printing * { visibility: hidden !important; }
        body.printing #a4-render-area,
        body.printing #a4-render-area * { visibility: visible !important; }
        body.printing #a4-render-area {
            position: absolute !important;
            left: 0 !important;
            top: 0 !important;
            width: 210mm !important;
            margin: 0 !important;
            padding: 0 !important;
            background: none !important;
            box-shadow: none !important;
        }
    }

    /* SweetAlert z-index above header */
    .swal2-container { z-index: 10000 !important; }

    /* Scrollbar polish for tables on mobile */
    .overflow-x-auto::-webkit-scrollbar { height: 8px; }
    .overflow-x-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
