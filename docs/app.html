<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Billing System — ใช้งานผ่าน GitHub Pages</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        display: flex; flex-direction: column; background: #f8fafc;
    }
    .topbar {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        background: #14532d; color: #fff; padding: 8px 14px; flex: 0 0 auto;
    }
    .topbar .title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .title small { font-weight: 400; color: #bbf7d0; margin-left: 6px; }
    .btns { display: flex; gap: 8px; flex: 0 0 auto; }
    .btns a, .btns button {
        font-size: 12.5px; font-weight: 600; text-decoration: none; cursor: pointer;
        color: #ecfdf5; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
        padding: 5px 12px; border-radius: 8px; transition: background .15s;
    }
    .btns a:hover, .btns button:hover { background: rgba(255,255,255,.25); }
    iframe { flex: 1 1 auto; width: 100%; border: 0; background: #fff; }
    .fallback {
        display: none; padding: 40px 20px; text-align: center; color: #334155; line-height: 1.9;
    }
    .fallback a {
        display: inline-block; margin-top: 14px; background: #15803d; color: #fff; font-weight: 700;
        text-decoration: none; padding: 12px 28px; border-radius: 10px;
    }
</style>
</head>
<body>
    <div class="topbar">
        <div class="title">🧾 Smart Billing System <small>· ใช้งานผ่าน GitHub Pages</small></div>
        <div class="btns">
            <button onclick="document.getElementById('app-frame').src=APP_URL">🔄 รีเฟรช</button>
            <a id="open-direct" href="#" target="_blank" rel="noopener" referrerpolicy="no-referrer">↗ เปิดในแท็บใหม่</a>
            <a href="index.html">🏠 หน้าแรก</a>
        </div>
    </div>
    <iframe id="app-frame" title="Smart Billing Web App" allow="clipboard-write"></iframe>
    <div class="fallback" id="fallback">
        <strong>ไม่สามารถแสดงแอปในหน้านี้ได้</strong><br>
        เบราว์เซอร์ของคุณอาจบล็อกการทำงานของ Google ในกรอบฝัง (third-party cookies)<br>
        กดปุ่มด้านล่างเพื่อเปิดระบบโดยตรง
        <br><a href="#" id="fallback-link" target="_blank" rel="noopener" referrerpolicy="no-referrer">🚀 เปิด Smart Billing โดยตรง</a>
    </div>
<script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbxxpLbxy0VEFDA93WoIuZCWsXC-AenXMsUXWNKiOdUR5dHI9Sla8PLBAzP4Ja9nt-Mk/exec';
    document.getElementById('open-direct').href = APP_URL;
    document.getElementById('fallback-link').href = APP_URL;

    const frame = document.getElementById('app-frame');
    let loaded = false;
    frame.addEventListener('load', () => { loaded = true; });
    frame.src = APP_URL;

    /* ถ้า 15 วินาทีแล้วเฟรมยังว่าง (Google บล็อก) → แสดงทางเลือกเปิดตรง */
    setTimeout(() => {
        if (!loaded) {
            try {
                if (!frame.contentWindow || !frame.contentWindow.length) {
                    document.getElementById('fallback').style.display = 'block';
                    frame.style.display = 'none';
                }
            } catch (e) { /* cross-origin ปกติ = โหลดสำเร็จ */ }
        }
    }, 15000);
</script>
</body>
</html>
